apply plugin: 'maven-publish'

publishing {
    publications {
        release(MavenPublication) {
            afterEvaluate {
                from components.release
            }
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            // Publishes to AeonCoreX-Lab's own fork registry, NOT upstream
            // trustwallet/wallet-core — the fork's GITHUB_TOKEN has no
            // publish rights on the upstream repo anyway.
            url = uri("https://maven.pkg.github.com/AeonCoreX-Lab/wallet-core")
            credentials {
                // build-android-aar.yml sets GITHUB_ACTOR (not GITHUB_USER)
                // alongside GITHUB_TOKEN — must match exactly or auth is null.
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
        mavenLocal()
    }
}
